<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .form-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .hidden {
            display: none;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
        }
        .success {
            color: green;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Смена пароля</h2>
    <div class="form-group">
        <label for="email">Электронная почта</label>
        <input type="email" id="email" placeholder="Введите вашу почту" required>
    </div>
    <button onclick="requestVerificationCode()">Сменить пароль</button>
    <div id="error-message" class="error"></div>

    <div id="verification-form" class="hidden">
        <div class="form-group">
            <label for="code">Код подтверждения</label>
            <input type="text" id="code" placeholder="Введите код" required>
        </div>
        <div class="form-group">
            <label for="new-password">Новый пароль</label>
            <input type="password" id="new-password" placeholder="Введите новый пароль" required>
        </div>
        <div class="form-group">
            <label for="confirm-password">Подтвердите пароль</label>
            <input type="password" id="confirm-password" placeholder="Подтвердите новый пароль" required>
        </div>
        <button onclick="changePassword()">Подтвердить</button>
        <div id="verification-error" class="error"></div>
        <div id="success-message" class="success"></div>
    </div>
</div>

<script>
    async function requestVerificationCode() {
        const email = document.getElementById('email').value;
        const errorMessage = document.getElementById('error-message');

        if (!email) {
            errorMessage.textContent = 'Пожалуйста, введите электронную почту';
            return;
        }

        try {
            const response = await fetch('/send-verification-code-for-change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ login: email }),
            });

            if (response.ok) {
                document.getElementById('verification-form').classList.remove('hidden');
                errorMessage.textContent = '';
            } else {
                const error = await response.json();
                errorMessage.textContent = error.message || 'Ошибка при отправке кода';
            }
        } catch (error) {
            errorMessage.textContent = 'Произошла ошибка. Попробуйте снова.';
        }
    }

    async function changePassword() {
        const email = document.getElementById('email').value;
        const code = document.getElementById('code').value;
        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorMessage = document.getElementById('verification-error');
        const successMessage = document.getElementById('success-message');

        // Clear previous messages
        errorMessage.textContent = '';
        successMessage.textContent = '';

        if (!code || !newPassword || !confirmPassword) {
            errorMessage.textContent = 'Пожалуйста, заполните все поля';
            return;
        }

        if (newPassword !== confirmPassword) {
            errorMessage.textContent = 'Пароли не совпадают';
            return;
        }

        if (newPassword.length < 8) {
            errorMessage.textContent = 'Пароль должен содержать минимум 8 символов';
            return;
        }

        try {
            const response = await fetch('/settings/verify-and-change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    profile: { login: email, password: newPassword },
                    code: code,
                }),
            });

            if (response.ok) {
                successMessage.textContent = 'Пароль успешно изменен! Перенаправление на страницу входа...';
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000); // Redirect after 2 seconds to allow user to see the success message
            } else {
                const error = await response.json();
                errorMessage.textContent = error.message || 'Ошибка при смене пароля';
            }
        } catch (error) {
            errorMessage.textContent = 'Произошла ошибка. Попробуйте снова.';
        }
    }
</script>
</body>
</html>
